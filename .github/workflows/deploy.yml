name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, windows, x64, portfolio]
    timeout-minutes: 25

    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type and Svelte checks
        run: npm run check

      - name: Run tests when configured
        run: npm test --if-present

      - name: Build static site
        run: npm run build

      - name: Promote verified release
        run: |
          $releaseId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_SHA"
          & .\scripts\Deploy-Portfolio.ps1 `
            -BuildPath .\build `
            -DeployRoot 'C:\web\portfolio' `
            -ReleaseId $releaseId `
            -HealthUrl 'http://127.0.0.1:8080'
